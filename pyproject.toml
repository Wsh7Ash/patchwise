[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "patchwise"
version = "1.0.0"
description = "50 validated vulnerability-remediation skills plus a fixplan CLI for fixers and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["remediation", "patching", "agent-skills", "security", "incident-response"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
patchwise = "patchwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"